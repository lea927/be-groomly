codecov:
  require_ci_to_pass: false  # Don't require all other CI to pass

coverage:
  precision: 2
  round: down
  range: "60...90"
  
  status:
    project:
      default:
        # Make project check informational only
        target: auto
        threshold: 10%  # Allow 10% drop without failing
        base: auto
        branches: 
          - main
        if_ci_failed: success  # Don't fail if CI fails
        informational: true    # Make it informational only, won't fail the build
        flags:
          - unit
        paths:
          - src
        # Set thresholds to match Jest configuration
        thresholds:
          - type: "branches"
            target: 50%
            if_not_found: success
          - type: "functions"
            target: 70%
            if_not_found: success
          - type: "lines"
            target: 70%
            if_not_found: success
          - type: "statements"
            target: 70%
            if_not_found: success
    
    # Explicitly disable all patch checks
    patch: off

comment:
  layout: "reach,diff,flags,files,footer"
  behavior: default
  require_changes: false
  require_base: false
  require_head: false

ignore:
  - "src/config"
  - "src/tests"
  - "tests"
  - "node_modules"
