codecov:
  require_ci_to_pass: false

coverage:
  precision: 2
  round: down
  range: "60...90"
  
  status:
    project:
      default:
        # Make project check informational only
        target: auto
        threshold: 10%
        base: auto
        branches: 
          - main
        if_ci_failed: success
        informational: true
        flags:
          - unit
        paths:
          - src
        thresholds:
          - type: "branches"
            target: 50%
            if_not_found: success
          - type: "functions"
            target: 70%
            if_not_found: success
          - type: "lines"
            target: 70%
            if_not_found: success
          - type: "statements"
            target: 70%
            if_not_found: success
    
    patch:
      default:
        # Explicitly disable patch checking with informational flag
        informational: true
        only_pulls: true

comment:
  layout: "reach,diff,flags,files,footer"
  behavior: default
  require_changes: false
  require_base: false
  require_head: false

ignore:
  - "src/config"
  - "src/tests"
  - "tests"
  - "node_modules"
